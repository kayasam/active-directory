<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="fleche-rouge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1100" height="360" fill="#f8fafc"/>

  <text x="550" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Comment un simple poste fait tomber tout le domaine</text>
  <text x="550" y="66" text-anchor="middle" font-size="14" fill="#64748b">Se connecter laisse des identifiants en mémoire (LSASS) sur la machine</text>

  <!-- Carte 1 -->
  <g filter="url(#card-shadow)">
    <rect x="20" y="95" width="190" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <circle cx="48" cy="123" r="14" fill="#2563eb"/>
  <text x="48" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="70" y="128" font-size="15" font-weight="700" fill="#1e293b">Poste infecté</text>
  <text x="38" y="165" font-size="13" fill="#1e293b">PC-PROD-01 ouvre</text>
  <text x="38" y="185" font-size="13" fill="#1e293b">une pièce jointe piégée.</text>
  <text x="38" y="215" font-size="13" fill="#64748b">L'attaquant est sur</text>
  <text x="38" y="235" font-size="13" fill="#64748b">la machine et attend.</text>

  <line x1="212" y1="185" x2="238" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>

  <!-- Carte 2 -->
  <g filter="url(#card-shadow)">
    <rect x="240" y="95" width="190" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <circle cx="268" cy="123" r="14" fill="#2563eb"/>
  <text x="268" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="290" y="128" font-size="15" font-weight="700" fill="#1e293b">Un admin arrive</text>
  <text x="258" y="165" font-size="13" fill="#1e293b">Un technicien s'y connecte</text>
  <text x="258" y="185" font-size="13" fill="#1e293b">avec un compte</text>
  <text x="258" y="205" font-size="13" font-weight="700" fill="#d97706">Admin du domaine</text>
  <text x="258" y="235" font-size="13" fill="#64748b">pour dépanner</text>
  <text x="258" y="255" font-size="13" fill="#64748b">l'imprimante.</text>

  <line x1="432" y1="185" x2="458" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>

  <!-- Carte 3 -->
  <g filter="url(#card-shadow)">
    <rect x="460" y="95" width="190" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <circle cx="488" cy="123" r="14" fill="#2563eb"/>
  <text x="488" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="510" y="128" font-size="15" font-weight="700" fill="#1e293b">Secret en mémoire</text>
  <text x="478" y="165" font-size="13" fill="#1e293b">Le hash et les tickets</text>
  <text x="478" y="185" font-size="13" fill="#1e293b">Kerberos du compte</text>
  <text x="478" y="205" font-size="13" fill="#1e293b">restent dans <tspan font-weight="700">LSASS</tspan>.</text>
  <text x="478" y="235" font-size="13" fill="#64748b">Même après la</text>
  <text x="478" y="255" font-size="13" fill="#64748b">déconnexion, parfois.</text>

  <line x1="652" y1="185" x2="678" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#fleche)"/>

  <!-- Carte 4 -->
  <g filter="url(#card-shadow)">
    <rect x="680" y="95" width="190" height="180" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <circle cx="708" cy="123" r="14" fill="#2563eb"/>
  <text x="708" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="730" y="128" font-size="15" font-weight="700" fill="#1e293b">Vol et réutilisation</text>
  <text x="698" y="165" font-size="13" fill="#1e293b">L'attaquant extrait</text>
  <text x="698" y="185" font-size="13" fill="#1e293b">le secret et le rejoue :</text>
  <text x="698" y="205" font-size="13" font-weight="700" fill="#1e293b">pass-the-hash</text>
  <text x="698" y="235" font-size="13" fill="#64748b">Pas besoin de connaître</text>
  <text x="698" y="255" font-size="13" fill="#64748b">le mot de passe.</text>

  <line x1="872" y1="185" x2="898" y2="185" stroke="#dc2626" stroke-width="2.5" marker-end="url(#fleche-rouge)"/>

  <!-- Carte 5 -->
  <g filter="url(#card-shadow)">
    <rect x="900" y="95" width="180" height="180" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <circle cx="928" cy="123" r="14" fill="#dc2626"/>
  <text x="928" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="950" y="128" font-size="15" font-weight="700" fill="#dc2626">Domaine perdu</text>
  <text x="918" y="165" font-size="13" fill="#1e293b">Connexion à <tspan font-weight="700">DC01</tspan></text>
  <text x="918" y="185" font-size="13" fill="#1e293b">en Admin du domaine :</text>
  <text x="918" y="215" font-size="13" fill="#1e293b">comptes, GPO,</text>
  <text x="918" y="235" font-size="13" fill="#1e293b">rançongiciel sur</text>
  <text x="918" y="255" font-size="13" fill="#1e293b">tout le parc.</text>

  <!-- Bandeau conclusion -->
  <rect x="20" y="300" width="1060" height="42" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="327" text-anchor="middle" font-size="15" fill="#1e293b">Le tiering coupe la chaîne à l'étape <tspan font-weight="700" fill="#2563eb">2</tspan> : un compte Admin du domaine n'a tout simplement <tspan font-weight="700">pas le droit</tspan> d'ouvrir une session sur un poste.</text>
</svg>
